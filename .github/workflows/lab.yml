name: lab
# Runs every method file in lab/methods on 16 pairs in parallel, then writes results/SUMMARY.md
on:
  workflow_dispatch:
    inputs:
      methods: {description: 'method files to run, comma separated (blank = all)', required: false, default: ''}
  push:
    paths: ['lab/engine.py', 'lab/run.py', 'lab/summarise.py', 'lab/methods/**', '.github/workflows/lab.yml']
permissions:
  contents: write
concurrency: {group: lab, cancel-in-progress: false}
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        include:
          - {a: ETHUSDT}
          - {a: BTCUSDT}
          - {a: SOLUSDT}
          - {a: XRPUSDT}
          - {a: BNBUSDT}
          - {a: DOGEUSDT}
          - {a: ADAUSDT}
          - {a: TRXUSDT}
          - {a: LINKUSDT}
          - {a: AVAXUSDT}
          - {a: BTCUSDT, b: ETHUSDT}
          - {a: SOLUSDT, b: ETHUSDT}
          - {a: LINKUSDT, b: ETHUSDT}
          - {a: BNBUSDT, b: ETHUSDT}
          - {a: BTCUSDT, b: BNBUSDT}
          - {a: XRPUSDT, b: BTCUSDT}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip, cache-dependency-path: lab/requirements.txt}
      - run: pip install -r lab/requirements.txt
      - run: python lab/run.py ${{ matrix.a }} ${{ matrix.b }}
        env: {METHODS: '${{ github.event.inputs.methods }}'}
      - uses: actions/upload-artifact@v4
        with: {name: 'raw-${{ matrix.a }}-${{ matrix.b }}', path: results/out/}
  summary:
    needs: run
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: {pattern: 'raw-*', path: results/out, merge-multiple: true}
      - run: mkdir -p results/raw && cp results/out/*.csv results/raw/ && rm -rf results/out
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install pandas tabulate
      - run: |
          pip freeze | grep -i -E "pandas|numpy|tabulate" > results/summary_log.txt
          ls results/raw >> results/summary_log.txt
          python lab/summarise.py >> results/summary_log.txt 2>&1 || echo "SUMMARY FAILED" >> results/summary_log.txt
      - run: |
          git config user.name "lab-bot"
          git config user.email "lab-bot@users.noreply.github.com"
          git add results
          git commit -m "Lab results ${{ github.sha }}" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase -q && git push && break; sleep 10; done
