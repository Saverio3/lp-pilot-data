name: hook-tests
# Compiles the Earn hook and runs its test suite (incl. the split-trade attack test) on every change.
on:
  push:
    paths: ['hook/**', '.github/workflows/hook-tests.yml']
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {submodules: recursive}
      - uses: foundry-rs/foundry-toolchain@v1
      - run: forge --version
      - run: forge build --sizes
        working-directory: hook
      - run: forge test -vv
        working-directory: hook
