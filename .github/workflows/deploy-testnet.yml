name: deploy-testnet
# Deploys the Earn hook + demo pools to Unichain Sepolia (testnet). Run manually from the Actions tab.
# Needs repository secret TESTNET_PRIVATE_KEY: a NEW wallet used only for testnets, funded with free Unichain Sepolia ETH.
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {submodules: recursive}
      - uses: foundry-rs/foundry-toolchain@v1
      - name: Deploy
        working-directory: hook
        env:
          PRIVATE_KEY: ${{ secrets.TESTNET_PRIVATE_KEY }}
        run: |
          forge script script/DeployTestnet.s.sol --rpc-url https://sepolia.unichain.org --broadcast --slow 2>&1 | tee deploy_log.txt
          grep -q "ONCHAIN EXECUTION COMPLETE & SUCCESSFUL" deploy_log.txt
      - name: Save deployment record
        if: always()
        run: |
          mkdir -p hook/deployments
          sed -n '/== Logs ==/,/## Setting up/p' hook/deploy_log.txt > hook/deployments/unichain-sepolia.txt || true
          git config user.name "deploy-bot"
          git config user.email "deploy-bot@users.noreply.github.com"
          git add hook/deployments hook/broadcast || true
          git commit -m "Testnet deployment record" || exit 0
          for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 10; done
