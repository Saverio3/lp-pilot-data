name: fetch-binance-data
on:
  workflow_dispatch:
  push:
    paths: ['scripts/fetch.py', '.github/workflows/fetch.yml']
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install pandas pyarrow
      - run: python scripts/fetch.py
      - run: |
          git config user.name "data-bot"
          git config user.email "data-bot@users.noreply.github.com"
          git add data
          git commit -m "Update Binance 1m data and funding" || echo "nothing to commit"
          git push
