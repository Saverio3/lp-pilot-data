name: holding
on:
  workflow_dispatch:
  push:
    paths: ['lab/holding.py', 'lab/holding_summary.py', '.github/workflows/holding.yml']
permissions:
  contents: write
concurrency: {group: holding, cancel-in-progress: false}
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        include:
          - {a: ETHUSDT}
          - {a: BTCUSDT}
          - {a: SOLUSDT}
          - {a: XRPUSDT}
          - {a: BNBUSDT}
          - {a: DOGEUSDT}
          - {a: ADAUSDT}
          - {a: TRXUSDT}
          - {a: LINKUSDT}
          - {a: AVAXUSDT}
          - {a: BTCUSDT, b: ETHUSDT}
          - {a: SOLUSDT, b: ETHUSDT}
          - {a: LINKUSDT, b: ETHUSDT}
          - {a: BNBUSDT, b: ETHUSDT}
          - {a: BTCUSDT, b: BNBUSDT}
          - {a: XRPUSDT, b: BTCUSDT}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip, cache-dependency-path: lab/requirements.txt}
      - run: pip install -r lab/requirements.txt
      - run: python lab/holding.py ${{ matrix.a }} ${{ matrix.b }}
      - uses: actions/upload-artifact@v4
        with: {name: 'hold-${{ matrix.a }}-${{ matrix.b }}', path: results/holding_out/}
  summary:
    needs: run
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: {pattern: 'hold-*', path: results/holding, merge-multiple: true}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install pandas tabulate
      - run: python lab/holding_summary.py > results/holding_log.txt 2>&1 || echo "SUMMARY FAILED" >> results/holding_log.txt
      - run: |
          git config user.name "lab-bot"
          git config user.email "lab-bot@users.noreply.github.com"
          git add results
          git commit -m "Holding results ${{ github.sha }}" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase -q && git push && break; sleep 10; done
